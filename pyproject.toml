[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspectral"
version = "0.1.0"
description = "Pseudo-spectral incompressible Navier-Stokes DNS on the GPU from Python, near the FFT roofline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Walid Hemati" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["turbulence", "DNS", "pseudo-spectral", "FFT", "GPU", "CUDA", "Triton", "roofline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
triton = ["torch>=2.4", "triton>=3.0"]
cupy = ["cupy-cuda12x>=13"]
warp = ["warp-lang>=1.5", "torch>=2.4"]
gpu = ["torch>=2.4", "triton>=3.0", "cupy-cuda12x>=13", "warp-lang>=1.5"]
figures = ["matplotlib>=3.7", "pillow"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
pyspectral = "pyspectral.cli:main"

[project.urls]
Homepage = "https://github.com/walidhemati/pyspectral"

[tool.hatch.build.targets.wheel]
packages = ["src/pyspectral"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806", "N802", "E741", "N818", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning"]
markers = ["gpu: requires a CUDA GPU", "slow: long-running test"]
